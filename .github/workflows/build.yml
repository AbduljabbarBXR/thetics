name: Build Thetics

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: thetics-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-and-build:
    name: Analyze, test and build APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      # Keep the CI debug key stable across workflow runs. Without this, every
      # runner creates a new key and APK updates fail with a signature mismatch.
      - name: Cache Android debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: thetics-android-debug-keystore-v1

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test --reporter expanded

      - name: Build release APK
        run: |
          flutter build apk --release \
            --build-name=1.0.1 \
            --build-number=${{ github.run_number }}

      - name: Build web bundle
        run: flutter build web --release

      - name: Checksum APK
        run: |
          cd build/app/outputs/flutter-apk
          sha256sum app-release.apk > thetics-apk.sha256
          cat thetics-apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: thetics-apk-${{ github.run_number }}
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/thetics-apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: thetics-web-${{ github.run_number }}
          path: build/web
          if-no-files-found: error
          retention-days: 14
